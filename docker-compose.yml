version: '3.8'

services:
  web:
    build: ./backend
    volumes:
      - ./backend:/app
      - ./models:/app/models
      - ./media:/app/media
    ports:
      - "8000:8000"
    env_file:                     # ✅ Load environment variables from .env.dev
      - .env.dev
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: postgres:15
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: agrivision_dev
      POSTGRES_USER: fredrick
      POSTGRES_PASSWORD: Fr3dr1ck0w7n0
    volumes:
      - postgres_data:/var/lib/postgresql/data/

  frontend:
    build:
      context: ./frontend
      args:
        NODE_ENV: development
    working_dir: /app
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
    env_file:
      - .env.dev
    depends_on:
      - web
    restart: unless-stopped

volumes:
  postgres_data:
