version: '3.8'
services:
  web:
    build: ./backend
    volumes:
      - ./backend:/app
      - ./models:/app/models
      - ./media:/app/media 
    ports:
      - "8000:8000"
    environment:
      POSTGRES_DB: agrivision_dev
      POSTGRES_USER: fredrick          
      POSTGRES_PASSWORD: Fr3dr1ck0w7n0  
      DB_HOST: db
      DB_PORT: 5432
      PYTHONPATH: "/app"
    depends_on:
      - db
    restart: unless-stopped  

  db:
    image: postgres:15
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: agrivision_dev
      POSTGRES_USER: fredrick           
      POSTGRES_PASSWORD: Fr3dr1ck0w7n0  
    volumes:
      - postgres_data:/var/lib/postgresql/data/

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
    depends_on:
      - web
    restart: unless-stopped

volumes:
  postgres_data:
